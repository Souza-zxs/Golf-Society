# As funções expõem endpoints públicos (formulários, listagens) e endpoints
# administrativos protegidos pelo próprio header `Authorization: Bearer
# <access_token>` do Supabase Auth (ver _shared/requireAdmin.ts) — não pela
# verificação de JWT nativa do Hono/Supabase Functions. Desligamos verify_jwt
# para não exigir esse JWT em requisições públicas anônimas vindas do
# front-end; o requireAdmin faz sua própria validação nas rotas admin.
[functions.waitlist]
verify_jwt = false

[functions.membership-applications]
verify_jwt = false

[functions.sponsorships]
verify_jwt = false

[functions.meetings]
verify_jwt = false

